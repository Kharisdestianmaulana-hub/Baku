[package]
name = "baku"
version = "1.1.0"
description = "A native PDF editor"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5.0", features = [] }

[dependencies]
tauri = { version = "1.6.0", features = [ "path-all", "shell-all", "fs-all", "dialog-all", "window-all", "process-all", "app-all", "clipboard-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
printpdf = "0.7.0"
lopdf = "0.31.0"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.24"
objc = "0.2"

[features]
custom-protocol = ["tauri/custom-protocol"]
